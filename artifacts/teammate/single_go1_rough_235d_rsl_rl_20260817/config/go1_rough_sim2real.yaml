robot:
  control_dt: 0.02
  joint_count: 12
  joint_names: [FL_hip_joint, FR_hip_joint, RL_hip_joint, RR_hip_joint, FL_thigh_joint, FR_thigh_joint, RL_thigh_joint, RR_thigh_joint, FL_calf_joint, FR_calf_joint, RL_calf_joint, RR_calf_joint]
  default_joint_pos: [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
  action_scale: 0.25
  use_default_offset: true
observation:
  terms: [base_lin_vel, base_ang_vel, projected_gravity, velocity_commands, joint_pos, joint_vel, actions, height_scan]
  dimensions: [3, 3, 3, 3, 12, 12, 12, 187]
  height_scan_clip: 1.0
  history_length: 1
  require_height_scan: true
policy:
  framework: rsl_rl
  observation_dim: 235
  action_dim: 12
  hidden_layers: [512, 256, 128]
  activation: elu
  action_clip: null
safety:
  max_roll_rad: 0.7
  max_pitch_rad: 0.7
  max_joint_error_rad: 1.2
  max_action_delta: 0.25
  stale_state_timeout_s: 0.15
  require_enable_switch: true
transport:
  mode: dry_run
