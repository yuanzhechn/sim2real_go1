[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go1-sim2real"
version = "0.1.0"
description = "Unitree Go1 simulation-to-real runtime and safety layer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "torch>=2.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
