name: go1-sim2real
channels:
  - conda-forge
dependencies:
  # 3.11 在 ARM64 conda-forge 上同时受当前 PyTorch CPU 包和 pybind11 支持；
  # 不是运行层硬编码要求，项目本身仍支持 Python >=3.10。
  - python=3.11
  - numpy>=1.23
  # 固定到本机 ARM64 已验证可加载当前 TorchScript 的版本。
  - pytorch-cpu=2.7.*
  - pyyaml>=6
  - pybind11>=2.10
  - msgpack-cxx
  # Unitree Go1 SDK 内置的旧 pybind11 尚不兼容 CMake 4。
  - cmake>=3.18,<4
  - pytest>=7
  - pip
